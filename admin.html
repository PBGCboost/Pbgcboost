<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - PBGCboost</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.85;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .message {
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-weight: bold;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .loading {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button,
    .btn {
      border: none;
      border-radius: 7px;
      padding: 11px 15px;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
    }

    .btn-refresh {
      background: #2563eb;
      color: white;
    }

    .btn-logout {
      background: #dc2626;
      color: white;
    }

    .btn-link {
      background: #374151;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .stat span {
      color: #666;
      font-size: 13px;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: white;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .order h3 {
      margin: 0 0 12px;
      color: #111827;
    }

    .order p {
      margin: 7px 0;
      word-break: break-word;
    }

    .order-label {
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-en-attente {
      background: #fef3c7;
      color: #92400e;
    }

    .status-en-cours {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-termine {
      background: #dcfce7;
      color: #166534;
    }

    .status-annule {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .actions select {
      padding: 9px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
    }

    .btn-status {
      background: #16a34a;
      color: white;
    }

    .btn-whatsapp {
      background: #25d366;
      color: white;
    }

    .btn-open {
      background: #6366f1;
      color: white;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      color: #666;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 430px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat strong {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>PBGCboost — Administration</h1>
  <p>Gestion des commandes</p>
</header>

<div class="container">

  <div id="errorMessage" class="message error"></div>
  <div id="successMessage" class="message success"></div>

  <div id="loading" class="loading">
    🔐 Vérification de l’administrateur...
  </div>

  <div id="adminContent" style="display:none;">

    <div class="top-actions">
      <button class="btn btn-refresh" onclick="loadOrders()">
        🔄 Actualiser
      </button>

      <a class="btn btn-link" href="admin-depots.html">
        💰 Gérer les dépôts
      </a>

      <a class="btn btn-link" href="espace-client.html">
        👤 Espace client
      </a>

      <button class="btn btn-logout" onclick="logoutAdmin()">
        🚪 Déconnexion
      </button>
    </div>

    <div class="stats">
      <div class="stat">
        <strong id="totalOrders">0</strong>
        <span>Total commandes</span>
      </div>

      <div class="stat">
        <strong id="pendingOrders">0</strong>
        <span>En attente</span>
      </div>

      <div class="stat">
        <strong id="processingOrders">0</strong>
        <span>En cours</span>
      </div>

      <div class="stat">
        <strong id="finishedOrders">0</strong>
        <span>Terminées</span>
      </div>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔎 Rechercher une commande, un email, un service..."
        oninput="displayOrders()"
      >
    </div>

    <div id="orders" class="orders"></div>

  </div>
</div>


<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    doc
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =========================================================
     CONFIGURATION FIREBASE
     IMPORTANT :
     Cette configuration est exactement celle des autres pages.
     ========================================================= */

  const firebaseConfig = {
    apiKey: "AIzaSyBhRZ1j_cPbsQoMromaM2FlomLGDs5BwEQ",
    authDomain: "pbgcboost.firebaseapp.com",
    projectId: "pbgcboost",
    storageBucket: "pbgcboost.firebasestorage.app",
    messagingSenderId: "1086041371195",
    appId: "1:1086041371195:web:3ade541590b85a5595221e"
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);


  /* =========================================================
     UID ADMINISTRATEUR
     ========================================================= */

  const ADMIN_UID = "XZT7MEF2I1fCWBc5reTUU9Cegnk1";


  let allOrders = [];


  /* =========================================================
     OUTILS MESSAGES
     ========================================================= */

  function showError(message) {
    const box = document.getElementById("errorMessage");
    box.textContent = "❌ " + message;
    box.style.display = "block";

    document.getElementById("successMessage").style.display = "none";
  }


  function showSuccess(message) {
    const box = document.getElementById("successMessage");
    box.textContent = "✅ " + message;
    box.style.display = "block";

    document.getElementById("errorMessage").style.display = "none";

    setTimeout(() => {
      box.style.display = "none";
    }, 4000);
  }


  /* =========================================================
     VERIFICATION ADMIN
     ========================================================= */

  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      document.getElementById("loading").innerHTML =
        "⚠️ Vous devez être connecté pour accéder à l'administration.";

      setTimeout(() => {
        window.location.href = "connexion.html";
      }, 2000);

      return;
    }


    console.log("Utilisateur connecté :", user.uid);


    if (user.uid !== ADMIN_UID) {

      document.getElementById("loading").innerHTML =
        "⛔ Accès refusé : ce compte n'est pas administrateur.";

      showError(
        "Ce compte n'a pas les droits administrateur."
      );

      return;
    }


    /* ADMIN CORRECT */

    document.getElementById("loading").style.display = "none";
    document.getElementById("adminContent").style.display = "block";

    await loadOrders();

  });


  /* =========================================================
     CHARGER LES COMMANDES
     ========================================================= */

  window.loadOrders = async function () {

    try {

      document.getElementById("orders").innerHTML =
        '<div class="loading">⏳ Chargement des commandes...</div>';


      const snapshot = await getDocs(
        collection(db, "commandes")
      );


      allOrders = [];


      snapshot.forEach((documentSnapshot) => {

        allOrders.push({
          id: documentSnapshot.id,
          ...documentSnapshot.data()
        });

      });


      /* Trier : plus récentes d'abord */

      allOrders.sort((a, b) => {

        const dateA = a.date?.seconds || 0;
        const dateB = b.date?.seconds || 0;

        return dateB - dateA;

      });


      updateStats();
      displayOrders();


    } catch (error) {

      console.error("Erreur Firebase :", error);

      showError(
        "Impossible de charger les commandes : " +
        error.message
      );

      document.getElementById("orders").innerHTML =
        '<div class="empty">❌ Impossible de charger les commandes.</div>';
    }

  };


  /* =========================================================
     STATISTIQUES
     ========================================================= */

  function updateStats() {

    const total = allOrders.length;

    const pending = allOrders.filter(
      order => order.statut === "En attente"
    ).length;

    const processing = allOrders.filter(
      order => order.statut === "En cours"
    ).length;

    const finished = allOrders.filter(
      order => order.statut === "Terminé"
    ).length;


    document.getElementById("totalOrders").textContent =
      total;

    document.getElementById("pendingOrders").textContent =
      pending;

    document.getElementById("processingOrders").textContent =
      processing;

    document.getElementById("finishedOrders").textContent =
      finished;
  }


  /* =========================================================
     AFFICHER LES COMMANDES
     ========================================================= */

  window.displayOrders = function () {

    const container = document.getElementById("orders");

    const search =
      document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


    let orders = allOrders;


    if (search) {

      orders = allOrders.filter(order => {

        const text = `
          ${order.service || ""}
          ${order.email || ""}
          ${order.lien || ""}
          ${order.paiement || ""}
          ${order.transaction || ""}
          ${order.statut || ""}
          ${order.uid || ""}
        `.toLowerCase();

        return text.includes(search);

      });

    }


    if (orders.length === 0) {

      container.innerHTML =
        '<div class="empty">📭 Aucune commande trouvée.</div>';

      return;
    }


    container.innerHTML = "";


    orders.forEach(order => {

      const card = document.createElement("div");
      card.className = "order";


      const statut =
        order.statut || "En attente";


      let statusClass = "status-en-attente";


      if (statut === "En cours") {
        statusClass = "status-en-cours";
      }

      if (statut === "Terminé") {
        statusClass = "status-termine";
      }

      if (statut === "Annulé") {
        statusClass = "status-annule";
      }


      const dateText = formatDate(order.date);


      card.innerHTML = `

        <h3>
          📦 Commande
        </h3>

        <p>
          <span class="order-label">Service :</span>
          ${escapeHtml(order.service || "Non renseigné")}
        </p>

        <p>
          <span class="order-label">Quantité :</span>
          ${escapeHtml(String(order.quantite || "Non renseignée"))}
        </p>

        <p>
          <span class="order-label">Prix :</span>
          ${escapeHtml(String(order.prix || 0))} FCFA
        </p>

        <p>
          <span class="order-label">Lien :</span>
          ${escapeHtml(order.lien || "Non renseigné")}
        </p>

        <p>
          <span class="order-label">Email :</span>
          ${escapeHtml(order.email || "Non renseigné")}
        </p>

        <p>
          <span class="order-label">Paiement :</span>
          ${escapeHtml(order.paiement || "Non renseigné")}
        </p>

        <p>
          <span class="order-label">Transaction :</span>
          ${escapeHtml(order.transaction || "Non renseignée")}
        </p>

        <p>
          <span class="order-label">Date :</span>
          ${dateText}
        </p>

        <p>
          <span class="order-label">Statut :</span>
          <span class="status ${statusClass}">
            ${escapeHtml(statut)}
          </span>
        </p>

        <div class="actions">

          <select id="status-${order.id}">
            <option value="En attente"
              ${statut === "En attente" ? "selected" : ""}>
              En attente
            </option>

            <option value="En cours"
              ${statut === "En cours" ? "selected" : ""}>
              En cours
            </option>

            <option value="Terminé"
              ${statut === "Terminé" ? "selected" : ""}>
              Terminé
            </option>

            <option value="Annulé"
              ${statut === "Annulé" ? "selected" : ""}>
              Annulé
            </option>
          </select>

          <button
            class="btn btn-status"
            onclick="changeStatus('${order.id}')">
            💾 Modifier
          </button>

          ${
            order.email
              ? `
                <a
                  class="btn btn-whatsapp"
                  href="https://wa.me/?text=${encodeURIComponent(
                    "Bonjour, concernant votre commande PBGCboost : " +
                    (order.service || "") +
                    " - quantité " +
                    (order.quantite || "")
                  )}"
                  target="_blank">
                  WhatsApp
                </a>
              `
              : ""
          }

          ${
            order.lien
              ? `
                <a
                  class="btn btn-open"
                  href="${safeUrl(order.lien)}"
                  target="_blank"
                  rel="noopener">
                  🔗 Ouvrir le lien
                </a>
              `
              : ""
          }

        </div>
      `;


      container.appendChild(card);

    });

  };


  /* =========================================================
     MODIFIER LE STATUT
     ========================================================= */

  window.changeStatus = async function (orderId) {

    try {

      const select =
        document.getElementById("status-" + orderId);

      const newStatus = select.value;


      await updateDoc(
        doc(db, "commandes", orderId),
        {
          statut: newStatus
        }
      );


      /* Mettre à jour l'affichage local */

      const order = allOrders.find(
        item => item.id === orderId
      );

      if (order) {
        order.statut = newStatus;
      }


      updateStats();
      displayOrders();


      showSuccess(
        "Statut modifié : " + newStatus
      );


    } catch (error) {

      console.error(error);

      showError(
        "Impossible de modifier le statut : " +
        error.message
      );

    }

  };


  /* =========================================================
     DECONNEXION
     ========================================================= */

  window.logoutAdmin = async function () {

    try {

      await signOut(auth);

      window.location.href = "connexion.html";

    } catch (error) {

      showError(
        "Erreur lors de la déconnexion : " +
        error.message
      );

    }

  };


  /* =========================================================
     DATE FIREBASE
     ========================================================= */

  function formatDate(timestamp) {

    if (!timestamp) {
      return "Date inconnue";
    }


    try {

      let date;


      if (timestamp.toDate) {
        date = timestamp.toDate();
      } else if (timestamp.seconds) {
        date = new Date(timestamp.seconds * 1000);
      } else {
        return "Date inconnue";
      }


      return date.toLocaleString("fr-FR");

    } catch (error) {

      return "Date inconnue";

    }

  }


  /* =========================================================
     SECURITE AFFICHAGE TEXTE
     ========================================================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================================
     URL SECURISEE
     ========================================================= */

  function safeUrl(url) {

    try {

      const parsed = new URL(url);

      if (
        parsed.protocol === "http:" ||
        parsed.protocol === "https:"
      ) {
        return parsed.href;
      }

    } catch (error) {}

    return "#";

  }

</script>

</body>
    </html>
