<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration - PBGCboost</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1877f2;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .top-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    #search {
      flex: 1;
      min-width: 220px;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .refresh-btn {
      background: #1877f2;
      color: white;
    }

    .refresh-btn:hover {
      background: #0d65d9;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .stat h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #666;
    }

    .stat strong {
      font-size: 24px;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .order-id {
      font-weight: bold;
      color: #1877f2;
    }

    .order-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .info {
      background: #f7f8fa;
      padding: 10px;
      border-radius: 8px;
    }

    .info strong {
      display: block;
      margin-bottom: 4px;
      color: #555;
      font-size: 13px;
    }

    .info span {
      word-break: break-word;
    }

    .link {
      color: #1877f2;
      text-decoration: none;
      word-break: break-all;
    }

    .link:hover {
      text-decoration: underline;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .whatsapp {
      background: #25d366;
      color: white;
    }

    .open-link {
      background: #6c757d;
      color: white;
    }

    .status-select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: white;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .status-en-attente {
      background: #fff3cd;
      color: #856404;
    }

    .status-en-cours {
      background: #cfe2ff;
      color: #084298;
    }

    .status-termine {
      background: #d1e7dd;
      color: #0f5132;
    }

    .status-annule {
      background: #f8d7da;
      color: #842029;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .error {
      background: #f8d7da;
      color: #842029;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      header {
        padding: 15px;
      }

      .order {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📦 PBGCboost</h1>
  <p>Administration des commandes</p>
</header>

<div class="top-bar">

  <input
    type="text"
    id="search"
    placeholder="🔎 Rechercher une commande..."
  >

  <button
    class="refresh-btn"
    onclick="loadOrders()"
  >
    🔄 Actualiser
  </button>

</div>

<div class="stats">

  <div class="stat">
    <h3>📦 Commandes</h3>
    <strong id="totalOrders">0</strong>
  </div>

  <div class="stat">
    <h3>💰 Total</h3>
    <strong id="totalAmount">0 FCFA</strong>
  </div>

  <div class="stat">
    <h3>⏳ En attente</h3>
    <strong id="pendingOrders">0</strong>
  </div>

  <div class="stat">
    <h3>🔄 En cours</h3>
    <strong id="progressOrders">0</strong>
  </div>

  <div class="stat">
    <h3>✅ Terminé</h3>
    <strong id="completedOrders">0</strong>
  </div>

  <div class="stat">
    <h3>❌ Annulé</h3>
    <strong id="cancelledOrders">0</strong>
  </div>

</div>

<div id="message"></div>

<div id="orders" class="orders">
  <div class="loading">
    Chargement des commandes...
  </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  orderBy,
  query
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "TON_API_KEY",

  authDomain: "TON_PROJET.firebaseapp.com",

  projectId: "TON_PROJECT_ID",

  storageBucket: "TON_PROJET.appspot.com",

  messagingSenderId: "TON_MESSAGING_SENDER_ID",

  appId: "TON_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let allOrders = [];


async function loadOrders() {

  const ordersContainer =
    document.getElementById("orders");

  const message =
    document.getElementById("message");

  ordersContainer.innerHTML =
    '<div class="loading">Chargement des commandes...</div>';

  message.innerHTML = "";

  try {

    const snapshot =
  await getDocs(
    collection(db, "commandes")
  );

    allOrders = [];

    snapshot.forEach((document) => {

      allOrders.push({

        id: document.id,

        ...document.data()

      });

    });

    displayOrders(allOrders);

    updateStats(allOrders);

  }

  catch (error) {

    console.error(error);

    ordersContainer.innerHTML = "";

    message.innerHTML = `
      <div class="error">
        ❌ Impossible de charger les commandes.
        <br><br>
        ${error.message}
      </div>
    `;

  }

}


function displayOrders(orders) {

  const container =
    document.getElementById("orders");

  if (orders.length === 0) {

    container.innerHTML = `
      <div class="empty">
        📭 Aucune commande trouvée.
      </div>
    `;

    return;

  }

  container.innerHTML = "";

  orders.forEach(order => {

    const card =
      createOrderCard(order);

    container.appendChild(card);

  });

}


function createOrderCard(order) {

  const card =
    document.createElement("div");

  card.className = "order";


  const quantity =
    order.quantite ??
    order.quantity ??
    "-";


  const link =
    order.lien ??
    order.link ??
    "";


  const whatsapp =
    order.whatsapp ??
    order.telephone ??
    order.phone ??
    order.numero ??
    "";


  const email =
    order.email ??
    "";


  const service =
    order.service ??
    "-";


  const prix =
    Number(
      order.prix ??
      order.price ??
      0
    );


  const paiement =
    order.paiement ??
    order.payment ??
    "-";


  const transaction =
    order.transaction ??
    "-";


  const status =
    order.statut ??
    order.status ??
    "En attente";


  const date =
    formatDate(order.date);


  card.innerHTML = `

    <div class="order-header">

      <div>

        <div class="order-id">
          📦 Commande #${escapeHtml(order.id)}
        </div>

        <small>
          ${date}
        </small>

      </div>

      <div>

        <span class="status ${getStatusClass(status)}">
          ${escapeHtml(status)}
        </span>

      </div>

    </div>


    <div class="order-info">

      <div class="info">
        <strong>👤 Email</strong>
        <span>
          ${escapeHtml(email || "-")}
        </span>
      </div>


      <div class="info">
        <strong>🛠️ Service</strong>
        <span>
          ${escapeHtml(service)}
        </span>
      </div>


      <div class="info">
        <strong>🔢 Quantité</strong>
        <span>
          ${escapeHtml(quantity)}
        </span>
      </div>


      <div class="info">
        <strong>💰 Prix</strong>
        <span>
          ${formatMoney(prix)}
        </span>
      </div>


      <div class="info">
        <strong>💳 Paiement</strong>
        <span>
          ${escapeHtml(paiement)}
        </span>
      </div>


      <div class="info">
        <strong>🧾 Transaction</strong>
        <span>
          ${escapeHtml(transaction)}
        </span>
      </div>


      <div class="info">
        <strong>📱 WhatsApp</strong>
        <span>
          ${escapeHtml(whatsapp || "-")}
        </span>
      </div>


      <div class="info">
        <strong>🔗 Lien à booster</strong>

        <span>

          ${
            link
            ?
            `<a
              class="link"
              href="${safeUrl(link)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Ouvrir le lien
            </a>`
            :
            "-"
          }

        </span>

      </div>

    </div>


    <div class="actions">

      <select
        class="status-select"
        data-id="${escapeHtml(order.id)}"
      >

        <option
          value="En attente"
          ${status === "En attente" ? "selected" : ""}
        >
          ⏳ En attente
        </option>

        <option
          value="En cours"
          ${status === "En cours" ? "selected" : ""}
        >
          🔄 En cours
        </option>

        <option
          value="Terminé"
          ${status === "Terminé" ? "selected" : ""}
        >
          ✅ Terminé
        </option>

        <option
          value="Annulé"
          ${status === "Annulé" ? "selected" : ""}
        >
          ❌ Annulé
        </option>

      </select>


      ${
        whatsapp
        ?
        `
        <button
          class="whatsapp"
          onclick="openWhatsApp('${escapeJs(whatsapp)}')"
        >
          📱 WhatsApp
        </button>
        `
        :
        ""
      }


      ${
        link
        ?
        `
        <button
          class="open-link"
          onclick="openOrderLink('${escapeJs(link)}')"
        >
          🔗 Ouvrir le lien
        </button>
        `
        :
        ""
      }

    </div>

  `;


  const select =
    card.querySelector(".status-select");


  select.addEventListener(
    "change",
    async function () {

      await changeStatus(
        order.id,
        this.value
      );

    }
  );


  return card;

}
    /*
  ============================================================
  CHANGER LE STATUT
  ============================================================
  */

  async function changeStatus(orderId, newStatus) {

    try {

      await updateDoc(
        doc(db, "commandes", orderId),
        {
          statut: newStatus
        }
      );

      const order =
        allOrders.find(
          item => item.id === orderId
        );

      if (order) {
        order.statut = newStatus;
      }

      updateStats(allOrders);

      displayOrders(
        filterOrders()
      );

      showMessage(
        "✅ Statut mis à jour."
      );

    } catch (error) {

      console.error(error);

      showMessage(
        "❌ Erreur lors de la modification du statut.",
        true
      );

    }

  }


  /*
  ============================================================
  STATISTIQUES
  ============================================================
  */

  function updateStats(orders) {

    let total = 0;
    let pending = 0;
    let progress = 0;
    let completed = 0;
    let cancelled = 0;

    orders.forEach(order => {

      const price =
        Number(
          order.prix ??
          order.price ??
          0
        );

      total += isNaN(price)
        ? 0
        : price;

      const status =
        order.statut ??
        order.status ??
        "En attente";

      if (status === "En attente") {
        pending++;
      }

      else if (status === "En cours") {
        progress++;
      }

      else if (status === "Terminé") {
        completed++;
      }

      else if (status === "Annulé") {
        cancelled++;
      }

    });


    document.getElementById(
      "totalOrders"
    ).textContent =
      orders.length;


    document.getElementById(
      "totalAmount"
    ).textContent =
      formatMoney(total);


    document.getElementById(
      "pendingOrders"
    ).textContent =
      pending;


    document.getElementById(
      "progressOrders"
    ).textContent =
      progress;


    document.getElementById(
      "completedOrders"
    ).textContent =
      completed;


    document.getElementById(
      "cancelledOrders"
    ).textContent =
      cancelled;

  }


  /*
  ============================================================
  RECHERCHE
  ============================================================
  */

  document.getElementById(
    "search"
  ).addEventListener(
    "input",
    function () {

      const filtered =
        filterOrders(this.value);

      displayOrders(filtered);

    }
  );


  function filterOrders(
    searchValue =
      document.getElementById("search").value
  ) {

    const search =
      searchValue
        .toLowerCase()
        .trim();


    if (!search) {
      return allOrders;
    }


    return allOrders.filter(order => {

      const text = [

        order.id,
        order.email,
        order.service,
        order.quantite,
        order.quantity,
        order.lien,
        order.link,
        order.whatsapp,
        order.telephone,
        order.phone,
        order.paiement,
        order.payment,
        order.transaction,
        order.statut,
        order.status,
        order.prix,
        order.price

      ]
      .join(" ")
      .toLowerCase();


      return text.includes(search);

    });

  }


  /*
  ============================================================
  WHATSAPP
  ============================================================
  */

  window.openWhatsApp =
    function(phone) {

      let number =
        String(phone)
        .replace(/\D/g, "");


      if (!number) {

        alert(
          "Numéro WhatsApp introuvable."
        );

        return;

      }


      /*
      Si le numéro commence par 0,
      on ajoute automatiquement
      l'indicatif du Bénin 229.
      */

      if (
        number.startsWith("0")
      ) {

        number =
          "229" +
          number.substring(1);

      }


      window.open(
        "https://wa.me/" + number,
        "_blank"
      );

    };


  /*
  ============================================================
  OUVRIR LE LIEN
  ============================================================
  */

  window.openOrderLink =
    function(link) {

      const url =
        safeUrl(link);


      if (!url) {

        alert(
          "Lien invalide."
        );

        return;

      }


      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    };


  /*
  ============================================================
  FORMAT ARGENT
  ============================================================
  */

  function formatMoney(amount) {

    return Number(
      amount || 0
    ).toLocaleString(
      "fr-FR"
    ) + " FCFA";

  }


  /*
  ============================================================
  FORMAT DATE
  ============================================================
  */

  function formatDate(date) {

    if (!date) {
      return "-";
    }


    try {

      if (
        typeof date.toDate ===
        "function"
      ) {

        return date
          .toDate()
          .toLocaleString(
            "fr-FR"
          );

      }


      if (date.seconds) {

        return new Date(
          date.seconds * 1000
        ).toLocaleString(
          "fr-FR"
        );

      }


      return new Date(
        date
      ).toLocaleString(
        "fr-FR"
      );

    }

    catch {

      return "-";

    }

  }


  /*
  ============================================================
  COULEUR DU STATUT
  ============================================================
  */

  function getStatusClass(status) {

    switch (status) {

      case "En cours":
        return "status-en-cours";

      case "Terminé":
        return "status-termine";

      case "Annulé":
        return "status-annule";

      default:
        return "status-en-attente";

    }

  }


  /*
  ============================================================
  PROTECTION AFFICHAGE HTML
  ============================================================
  */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

  }


  function escapeJs(value) {

    return String(
      value ?? ""
    )
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

  }


  /*
  ============================================================
  SECURISER LES LIENS
  ============================================================
  */

  function safeUrl(value) {

    try {

      const url =
        new URL(
          String(value)
        );


      if (
        url.protocol === "http:" ||
        url.protocol === "https:"
      ) {

        return url.href;

      }


      return "";

    }

    catch {

      return "";

    }

  }


  /*
  ============================================================
  MESSAGE
  ============================================================
  */

  function showMessage(
    text,
    isError = false
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.innerHTML = `

      <div
        style="
          padding:12px;
          margin-bottom:15px;
          background:${
            isError
            ? "#f8d7da"
            : "#d1e7dd"
          };
          color:${
            isError
            ? "#842029"
            : "#0f5132"
          };
          border-radius:8px;
        "
      >
        ${escapeHtml(text)}
      </div>

    `;


    setTimeout(
      () => {
        message.innerHTML = "";
      },
      3000
    );

  }


  /*
  ============================================================
  LANCEMENT
  ============================================================
  */

  loadOrders();

</script>

</body>
</html>
