<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Commande - PBGCboost</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
padding:20px;
}


.card{
background:white;
padding:20px;
max-width:500px;
margin:auto;
border-radius:12px;
box-shadow:0 2px 8px #ccc;
}


select,input{

width:90%;
padding:12px;
margin:10px;
border-radius:8px;

}


button{

background:#1877f2;
color:white;
padding:12px 25px;
border:none;
border-radius:8px;

}


</style>

</head>


<body>


<div class="card">


<h1>PBGCboost</h1>

<h2>🛒 Nouvelle commande</h2>



<select id="service">

<option>Choisir un service</option>

<option>Facebook J'aime</option>

<option>Facebook Abonnés</option>

<option>TikTok J'aime</option>

<option>TikTok Abonnés</option>

<option>YouTube</option>

<option>Instagram</option>

<option>Telegram</option>

</select>



<select id="quantite">

<option>Choisir quantité</option>

<option>200</option>

<option>500</option>

<option>1000</option>

<option>2000</option>

<option>10000</option>

</select>



<p id="prix">
Prix : 0 FCFA
</p>



<input id="lien" placeholder="Lien à booster">



<h3>Paiement</h3>


<p>
MTN Mobile Money : <b>01 90 29 75 37</b>
</p>


<p>
Moov Money : <b>01 68 67 76 87</b>
</p>



<select id="paiement">

<option>Choisir paiement</option>

<option>MTN Mobile Money</option>

<option>Moov Money</option>

</select>



<button onclick="envoyerCommande()">

Envoyer la commande

</button>



</div>



<script>


function envoyerCommande(){


let service =
document.getElementById("service").value;


let quantite =
document.getElementById("quantite").value;


let lien =
document.getElementById("lien").value;


let paiement =
document.getElementById("paiement").value;



let message =
"Bonjour PBGCboost%0A%0A"+
"Nouvelle commande%0A"+
"Service : "+service+"%0A"+
"Quantité : "+quantite+"%0A"+
"Lien : "+lien+"%0A"+
"Paiement : "+paiement;



window.open(
"https://wa.me/22990297537?text="+message
);


}


</script>



</body>
</html>
