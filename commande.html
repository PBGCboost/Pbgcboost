<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande - PBGCboost</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#1877f2;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

select,input,textarea{
width:100%;
padding:12px;
margin-top:5px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

.prix{
margin-top:20px;
padding:15px;
background:#e8f5e9;
border-radius:8px;
font-size:18px;
font-weight:bold;
}

.paiement{
margin-top:20px;
background:#fff3cd;
padding:15px;
border-radius:8px;
}

button{
width:100%;
margin-top:20px;
padding:15px;
border:none;
border-radius:8px;
background:#1877f2;
color:white;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>PBGCboost</h1>

<label>Service</label>

<select id="service">
<option value="">Choisir...</option>
<option>Facebook J'aime</option>
<option>Facebook Abonnés</option>
<option>TikTok J'aime</option>
<option>TikTok Abonnés</option>
<option>YouTube</option>
<option>Instagram</option>
<option>Telegram</option>
</select>

<label>Quantité</label>

<select id="quantite">
<option value="">Choisir...</option>
<option>200</option>
<option>500</option>
<option>1000</option>
<option>2000</option>
<option>10000</option>
</select>

<div class="prix">
Prix : <span id="prix">0</span> FCFA
</div>

<label>Lien à booster</label>

<input
id="lien"
type="text"
placeholder="Collez ici votre lien">

<div class="paiement">

<h3>Paiement</h3>

<p><b>MTN Mobile Money</b><br>
01 90 29 75 37</p>

<p><b>Moov Money</b><br>
01 68 67 76 87</p>

<label>Mode de paiement</label>

<select id="paiement">
<option>MTN Mobile Money</option>
<option>Moov Money</option>
</select>

<label>ID de transaction</label>

<input
id="transaction"
type="text"
placeholder="Exemple : PP240815XXXX">

</div>

<button id="envoyer">
Envoyer la commande
  </button>
  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhRZ1j_cPbsQoMromaM2FlomLGDs5BwEQ",
  authDomain: "pbgcboost.firebaseapp.com",
  projectId: "pbgcboost",
  storageBucket: "pbgcboost.firebasestorage.app",
  messagingSenderId: "1086041371195",
  appId: "1:1086041371195:web:3ade541590b85a5595221e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const prix = {
  "Facebook J'aime":{"200":300,"500":700,"1000":1300,"2000":2500,"10000":11000},
  "Facebook Abonnés":{"200":500,"500":1000,"1000":2000,"2000":4000,"10000":20000},
  "TikTok J'aime":{"200":500,"500":1100,"1000":2000,"2000":4000},
  "TikTok Abonnés":{"200":600,"500":1300,"1000":2600,"2000":5200},
  "YouTube":{"200":1000,"500":2500,"1000":5000},
  "Instagram":{"200":1000,"500":2500,"1000":5000},
  "Telegram":{"200":1000,"500":2500,"1000":5000}
};

function calculPrix(){
  const service = document.getElementById("service").value;
  const quantite = document.getElementById("quantite").value;

  let montant = 0;

  if(prix[service] && prix[service][quantite]){
    montant = prix[service][quantite];
  }

  document.getElementById("prix").textContent = montant;
}

document.getElementById("service").addEventListener("change",calculPrix);
document.getElementById("quantite").addEventListener("change",calculPrix);

document.getElementById("envoyer").addEventListener("click", async()=>{

const user = auth.currentUser;

if(!user){
alert("Veuillez vous connecter.");
return;
}

const service=document.getElementById("service").value;
const quantite=document.getElementById("quantite").value;
const lien=document.getElementById("lien").value;
const paiement=document.getElementById("paiement").value;
const transaction=document.getElementById("transaction").value;
const montant=document.getElementById("prix").textContent;

try{

await addDoc(collection(db,"commandes"),{

uid:user.uid,
email:user.email,
service:service,
quantite:quantite,
prix:montant,
lien:lien,
paiement:paiement,
transaction:transaction,
statut:"En attente",
date:serverTimestamp()

});
// Envoi de la notification à Pipedream
await fetch("https://eozjnkrglri1u1tg.m.pipedream.net", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    service: service,
    quantite: quantite,
    lien: lien,
    email: user.email,
    paiement: paiement,
    transaction: transaction,
    statut: "En attente"
  })
});
alert("Commande enregistrée avec succès !");

window.location.href="espace-client.html";

}catch(e){

alert("Erreur : "+e.message);

}

});

</script>

</body>
                          </html>
