<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Créer un compte - PBGCboost</title>
</head>

<body>

<h1>Créer un compte PBGCboost</h1>

<input id="email" type="email" placeholder="Email"><br><br>

<input id="password" type="password" placeholder="Mot de passe"><br><br>

<button onclick="inscription()">Créer mon compte</button>

<p>
Déjà un compte ?
<a href="connexion.html">Se connecter</a>
</p>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyBhRZ1j_cPbsQoMromaM2FlomLGDs5BwEQ",
authDomain: "pbgcboost.firebaseapp.com",
projectId: "pbgcboost",
storageBucket: "pbgcboost.firebasestorage.app",
messagingSenderId: "1086041371195",
appId: "1:1086041371195:web:3ade541590b85a5595221e"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


window.inscription = function(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;


createUserWithEmailAndPassword(auth,email,password)

.then(()=>{
alert("Compte créé avec succès !");
window.location.href="connexion.html";
})

.catch((error)=>{
alert(error.message);
});

}

</script>

</body>
</html>
