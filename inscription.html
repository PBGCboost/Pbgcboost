<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Créer un compte - PBGCboost</title>
<style>
body{
font-family:Arial;
text-align:center;
background:#f5f5f5;
padding:30px;
}
input, button{
width:90%;
padding:12px;
margin:8px;
border-radius:8px;
}
button{
background:#1877f2;
color:white;
border:none;
}
</style>
</head>

<body>

<h1>Créer un compte PBGCboost</h1>

<form>
<input type="text" placeholder="Nom ou pseudo" required>

<input type="email" placeholder="Adresse Email" required>

<input type="tel" placeholder="Numéro WhatsApp" required>

<input type="password" placeholder="Mot de passe" required>

<button type="submit">Créer mon compte</button>
</form>

</body>
</html>
