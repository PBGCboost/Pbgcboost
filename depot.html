<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dépôt - PBGCboost</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .payment-box {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .payment-box p {
      margin: 8px 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>💰 PBGCboost</h1>
  <p>Dépôt sur votre compte</p>
</header>

<div class="container">

  <div class="card">

    <h2>💰 Effectuer un dépôt</h2>

    <div class="payment-box">
      <strong>Envoyez d'abord l'argent :</strong>

      <p>📱 <strong>MTN Mobile Money :</strong><br>
      01 90 29 75 37</p>

      <p>📱 <strong>Moov Money :</strong><br>
      01 68 67 76 87</p>

      <p>
        Après le transfert, entrez ci-dessous le montant et
        l'identifiant de transaction.
      </p>
    </div>

    <label for="montant">Montant du dépôt (FCFA)</label>
    <input
      type="number"
      id="montant"
      min="100"
      placeholder="Exemple : 5000"
    >

    <label for="paiement">Mode de paiement</label>

    <select id="paiement">
      <option value="">Choisir un mode</option>
      <option value="MTN Mobile Money">MTN Mobile Money</option>
      <option value="Moov Money">Moov Money</option>
    </select>

    <label for="transaction">ID / Référence de transaction</label>

    <input
      type="text"
      id="transaction"
      placeholder="Exemple : 123456789"
    >

    <button id="btnDepot">
      💰 Envoyer la demande de dépôt
    </button>

    <div id="message" class="message"></div>

    <a href="espace-client.html" class="back">
      ← Retour à mon espace client
    </a>

  </div>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyBhRZ1j_cPbsQoMromaM2FlomLGDs5BwEQ",
    authDomain: "pbgcboost.firebaseapp.com",
    projectId: "pbgcboost",
    storageBucket: "pbgcboost.firebasestorage.app",
    messagingSenderId: "1086041371195",
    appId: "1:1086041371195:web:3ade541590b85a5595221e"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);
  const db = getFirestore(app);


  const montantInput = document.getElementById("montant");
  const paiementInput = document.getElementById("paiement");
  const transactionInput = document.getElementById("transaction");
  const btnDepot = document.getElementById("btnDepot");
  const message = document.getElementById("message");


  let currentUser = null;


  function afficherMessage(texte, type) {
    message.textContent = texte;
    message.className = "message " + type;
    message.style.display = "block";
  }


  onAuthStateChanged(auth, (user) => {

    currentUser = user;

    if (!user) {
      afficherMessage(
        "Veuillez vous connecter avant d'effectuer un dépôt.",
        "error"
      );

      btnDepot.disabled = true;
      return;
    }

    btnDepot.disabled = false;
  });


  btnDepot.addEventListener("click", async () => {

    if (!currentUser) {
      afficherMessage(
        "Veuillez vous connecter avant d'effectuer un dépôt.",
        "error"
      );
      return;
    }


    const montant = Number(montantInput.value);
    const paiement = paiementInput.value.trim();
    const transaction = transactionInput.value.trim();


    if (!montant || montant < 100) {
      afficherMessage(
        "Veuillez entrer un montant d'au moins 100 FCFA.",
        "error"
      );
      return;
    }


    if (!paiement) {
      afficherMessage(
        "Veuillez choisir le mode de paiement.",
        "error"
      );
      return;
    }


    if (!transaction) {
      afficherMessage(
        "Veuillez entrer l'identifiant de transaction.",
        "error"
      );
      return;
    }


    btnDepot.disabled = true;
    btnDepot.textContent = "Envoi en cours...";


    try {

      await addDoc(collection(db, "depots"), {

        uid: currentUser.uid,

        email: currentUser.email || "",

        montant: montant,

        paiement: paiement,

        transaction: transaction,

        statut: "En attente",

        date: serverTimestamp()

      });


      afficherMessage(
        "✅ Votre demande de dépôt a été envoyée. Elle sera vérifiée par l'administrateur.",
        "success"
      );


      montantInput.value = "";
      paiementInput.value = "";
      transactionInput.value = "";


    } catch (error) {

      console.error(error);

      afficherMessage(
        "❌ Impossible d'envoyer la demande. Veuillez réessayer.",
        "error"
      );

    }


    btnDepot.disabled = false;
    btnDepot.textContent = "💰 Envoyer la demande de dépôt";

  });

</script>

</body>
  </html>
